# Python Worker. Deploy with:  uv run pywrangler deploy
# Named differently from the existing TypeScript worker ("archive-platform") on purpose:
# both can live side by side, so nothing existing is overwritten while you test.
name = "archive-platform-py"
main = "src/entry.py"
compatibility_date = "2026-10-14"

[assets]
directory = "../artifacts/superstudent/dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Static files (site + /store/*.json snapshot) are served WITHOUT invoking the Worker,
# so they are free and unlimited. Only /api/* costs Worker requests (100,000/day free).
run_worker_first = ["/api/*"]

# No KV, no database: the only storage is Telegram (vault), Catbox (files) and the Cloudflare cache.

# Secrets (never put these in this file):
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID      (private channel id, e.g. -100123...)
#   npx wrangler secret put JWT_SECRET            (>= 32 random chars)
#   npx wrangler secret put PEPPER                (>= 32 random chars)
#   npx wrangler secret put EXPORT_TOKEN          (>= 24 random chars, used by the GitHub sync job)
#   npx wrangler secret put OWNER_EMAIL           (your e-mail: that account becomes superadmin)
